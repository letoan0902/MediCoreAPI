# ========================================
# MediCore API - Application Configuration
# NGƯỜI LÀM: Nhóm trưởng setup, cả nhóm dùng chung
# ========================================

# Server
server.port=8080

# Database - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/medicoredb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Người 1 - Phạm Phương Anh sử dụng)
jwt.secret=YourBase64EncodedSecretKeyHereAtLeast256BitsLong_ChangeThis
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=604800000

# Logging
logging.level.org.example.medicoreapi=DEBUG
logging.level.org.springframework.security=DEBUG
